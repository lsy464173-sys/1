<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>历史黄金矿工</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#ead09a;color:#4b2d16}button{border:0;cursor:pointer;font:inherit}.screen{height:100%;display:flex;align-items:center;justify-content:center}.start{background:radial-gradient(circle,#fff2c8,#d99d45);text-align:center}.card{width:min(90%,720px);padding:42px 25px;border:6px solid #744419;border-radius:32px;background:#fff1cddd;box-shadow:0 15px 50px #5d310944}.title{font:900 clamp(44px,9vw,82px)/1.15 "Arial Rounded MT Bold","Microsoft YaHei",sans-serif;color:#8a4a15;text-shadow:3px 4px #f4c75b;letter-spacing:4px}.sub{font-size:clamp(16px,3vw,25px);margin:18px 0 30px}.mainbtn,.nextbtn{padding:14px 34px;border-radius:999px;background:#b96819;color:#fff8df;font-weight:900;font-size:22px;box-shadow:0 6px #713b14}.game{display:none;flex-direction:column}.topbar{height:68px;min-height:68px;background:#603614;color:#fff1c5;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:900;z-index:10}.score{font-size:25px;color:#ffd15a}.controls button{background:#8d5525;color:#fff;border-radius:10px;padding:7px 10px;margin-left:4px}.field{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 35%,#f1d89f,#c98e48);}.field:before{content:"";position:absolute;inset:0;opacity:.13;background-image:radial-gradient(#4a2810 1px,transparent 1px);background-size:18px 18px}.mine{position:absolute;bottom:0;width:100%;height:26%;background:#70401f;border-top:9px solid #8d5829;clip-path:polygon(0 25%,8% 8%,16% 27%,25% 10%,34% 30%,44% 5%,54% 26%,64% 9%,73% 28%,83% 7%,92% 25%,100% 10%,100% 100%,0 100%)}.miner{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:50px;z-index:5;text-align:center}.miner span{display:block;font-size:14px;background:#633817;color:#fff;border-radius:20px;padding:2px 10px;margin-top:-7px}.rope{position:absolute;top:62px;left:50%;width:3px;height:0;background:#3e2817;transform-origin:top center;z-index:4}.hook{position:absolute;left:-11px;bottom:-14px;width:26px;height:26px;border:5px solid #47301b;border-top-color:transparent;border-radius:50%;transform:rotate(25deg)}.node{position:absolute;width:min(150px,28vw);min-height:55px;padding:9px;border-radius:17px;background:linear-gradient(#ffe59b,#dfa53b);border:3px solid #80501d;box-shadow:0 5px 8px #54301055;text-align:center;font-weight:900;font-size:clamp(13px,2.2vw,18px);display:flex;align-items:center;justify-content:center;z-index:3}.pop{position:absolute;font-size:25px;font-weight:900;z-index:25;animation:up 1s forwards}@keyframes up{to{transform:translateY(-60px);opacity:0}}.modal{position:absolute;inset:0;background:#24150699;display:none;align-items:center;justify-content:center;z-index:30}.modalbox{background:#fff1c8;border:5px solid #704019;border-radius:28px;padding:30px;text-align:center;width:min(90%,500px)}.modalbox h2{font-size:34px;margin:0 0 12px}.modalbox p{font-size:21px}.hint{position:absolute;top:74px;left:50%;transform:translateX(-50%);background:#6b401dcc;color:#fff3c8;padding:7px 15px;border-radius:20px;font-size:14px;z-index:8;white-space:nowrap}@media(max-width:600px){.topbar{height:62px;min-height:62px;font-size:13px}.score{font-size:20px}.controls button{font-size:12px;padding:6px}.miner{font-size:43px}.node{width:120px;min-height:50px}.hint{top:68px;font-size:12px}}
</style><body><section id="start" class="screen start"><div class="card"><div class="title">历史黄金矿工</div><div class="sub">一边挖宝，一边检验你的历史知识！</div><button class="mainbtn" id="startBtn">开始游戏</button></div></section><section id="game" class="screen game"><div class="topbar"><div id="level"></div><div class="score">得分：<span id="score">0</span></div><div class="controls"><button id="pause">暂停</button><button id="restart">重来</button><button id="sound">🔊</button></div></div><div id="field" class="field"><div class="hint">点击屏幕，放下钩子！</div><div id="miner" class="miner"></div><div id="rope" class="rope"><div class="hook"></div></div><div class="mine"></div><div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="next" class="nextbtn"></button></div></div></div></section><script>
const levels=[{name:"秦始皇",emoji:"👑",correct:["公元前221年统一六国","建立皇帝制度","推行郡县制","统一文字","统一货币","统一度量衡","修筑长城","开凿灵渠"],wrong:["统一铸造五铢钱","罢黜百家尊崇儒术","开通丝绸之路","派张骞出使西域","盐铁官营"]},{name:"汉武帝",emoji:"🧑‍⚖️",correct:["颁布“推恩令”","加强中央集权","罢黜百家尊崇儒术","盐铁官营","统一铸造五铢钱","派张骞出使西域","北击匈奴","设置刺史","察举制"],wrong:["建立皇帝制度","统一六国","推行郡县制","统一文字","统一度量衡","焚书坑儒","开凿灵渠"]}];
let li=0,score=0,grabbed=0,angle=-60,dir=1,state="swing",paused=false,soundOn=true,last=0,maxLen=0;
const $=id=>document.getElementById(id),field=$("field"),rope=$("rope");
$("startBtn").onclick=()=>{$("start").style.display="none";$("game").style.display="flex";init()};
$("restart").onclick=()=>{li=0;score=0;init()};
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"继续":"暂停"};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇"};
$("next").onclick=()=>{if(li===0){li=1;init()}else{li=0;score=0;init()}};
function beep(f,d){if(!soundOn)return;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.04;o.start();o.stop(c.currentTime+d)}catch(e){}}
function init(){grabbed=0;state="swing";paused=false;$("pause").textContent="暂停";$("score").textContent=score;$("level").textContent="第"+(li+1)+"关 · "+levels[li].name;$("miner").innerHTML=levels[li].emoji+"<span>"+levels[li].name+"</span>";$("modal").style.display="none";document.querySelectorAll(".node").forEach(n=>n.remove());rope.style.height="0";maxLen=Math.min(field.clientHeight*.8,Math.max(280,field.clientHeight*.76));place();last=performance.now();requestAnimationFrame(loop)}
function place(){let a=[...levels[li].correct.map(t=>({t,c:true})),...levels[li].wrong.map(t=>({t,c:false}))].sort(()=>Math.random()-.5),ps=[],W=field.clientWidth,H=field.clientHeight,w=Math.min(150,W*.28),h=62;for(let q of a){let ok=false,x=0,y=0;for(let k=0;k<500&&!ok;k++){x=8+Math.random()*Math.max(10,W-w-16);y=105+Math.random()*Math.max(20,maxLen-125);let cx=x+w/2,cy=y+h/2;if(ps.every(p=>Math.hypot(cx-p.x,cy-p.y)>Math.max(w,p.w)*.78)){ok=true;ps.push({x:cx,y:cy,w:w})}}if(!ok)continue;let n=document.createElement("div");n.className="node";n.textContent=q.t;n.dataset.correct=q.c;n.style.left=x+"px";n.style.top=y+"px";field.appendChild(n)}}
function loop(t){if(!paused&&state==="swing"){angle+=(t-last)*.045*dir;if(angle>64){angle=64;dir=-1}if(angle<-64){angle=-64;dir=1}rope.style.transform="translateX(-50%) rotate("+angle+"deg)"}last=t;requestAnimationFrame(loop)}
field.addEventListener("pointerdown",e=>{if(paused||state!=="swing")return;drop()});
function drop(){state="drop";let L=maxLen,rad=angle*Math.PI/180,sx=field.clientWidth/2,sy=62,ex=sx+Math.sin(rad)*L,ey=sy+Math.cos(rad)*L,hit=null,best=1e9;rope.style.height=L+"px";document.querySelectorAll(".node").forEach(n=>{if(n.dataset.hit)return;let r=n.getBoundingClientRect(),fr=field.getBoundingClientRect(),cx=r.left-fr.left+r.width/2,cy=r.top-fr.top+r.height/2,d=dist(sx,sy,ex,ey,cx,cy);if(d<Math.max(r.width,r.height)*.55&&d<best){best=d;hit=n}});setTimeout(()=>{if(hit){hit.dataset.hit=1;let good=hit.dataset.correct==="true";if(good){score+=10;grabbed++;hit.animate([{transform:"scale(1)"},{transform:"scale(.4)",opacity:0}],{duration:500});beep(760,.08)}else{score-=5;boom(hit);beep(180,.18)}$("score").textContent=score;pop(good?"+10":"-5",hit,good);setTimeout(()=>{hit.remove();check()},520)}setTimeout(()=>{rope.style.height="0";state="swing"},850)},450)}
function dist(ax,ay,bx,by,px,py){let dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function pop(txt,n,good){let p=document.createElement("div");p.className="pop";p.textContent=txt;p.style.left=n.style.left;p.style.top=n.style.top;p.style.color=good?"#17783d":"#b52c18";field.appendChild(p);setTimeout(()=>p.remove(),1000)}
function boom(n){let r=n.getBoundingClientRect(),fr=field.getBoundingClientRect();n.animate([{transform:"scale(1)"},{transform:"scale(1.25) rotate(8deg)"},{transform:"scale(.1)",opacity:0}],{duration:450});for(let i=0;i<16;i++){let s=document.createElement("span");s.textContent=["✦","◆","•","★"][i%4];s.style.cssText="position:absolute;left:"+(r.left-fr.left+r.width/2)+"px;top:"+(r.top-fr.top+r.height/2)+"px;font-size:18px;z-index:25";field.appendChild(s);let dx=(Math.random()-.5)*120,dy=(Math.random()-.5)*100;s.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px)",opacity:0}],{duration:500}).onfinish=()=>s.remove()}}
function check(){if(grabbed===levels[li].correct.length){state="done";setTimeout(()=>{if(li===0)show("🎊 秦关完成！","本关得分："+score,"进入下一关");else show("🏆 恭喜通关！","两关全部完成！总积分："+score,"重新开始")},350)}}
function show(t,p,b){$("modalTitle").textContent=t;$("modalText").textContent=p;$("next").textContent=b;$("modal").style.display="flex"}
</script></body></html>
